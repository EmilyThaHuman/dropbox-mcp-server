# Cloudflare Workers configuration for Dropbox MCP Server

name = "dropbox-mcp-server"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Worker settings
# Wrangler will handle TypeScript compilation automatically

# Environment variables
[vars]
MCP_SERVER_NAME = "dropbox-mcp-server"
MCP_SERVER_VERSION = "1.0.0"
NODE_ENV = "production"
PORT = "3003"

# Secrets (use: wrangler secret put <SECRET_NAME>)
# DROPBOX_CLIENT_ID
# DROPBOX_CLIENT_SECRET
# DROPBOX_REDIRECT_URI
# FRONTEND_URL
# BACKEND_API_URL (optional - for token fallback from profile.settings.oauth_tokens)

# KV Namespaces for session storage
[[kv_namespaces]]
binding = "SESSIONS"
id = "ced6ef1b0a744a49bde82278141ee215"

# Development settings
[env.development]
vars = { NODE_ENV = "development" }

# Production settings
[env.production]
vars = { NODE_ENV = "production" }

